[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "call-center-intelligence"
version = "1.0.0"
description = "AI-Powered Multi-Agent Call Center Analysis Pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1.10",
    "langchain>=1.2.0",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.2.0",
    "langchain-google-genai>=4.2.0",
    "langchain-groq>=0.2.0",
    "langsmith>=0.8.0",
    "openai>=2.33.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",
    "SQLAlchemy>=2.0.0",
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "faster-whisper>=1.1.0",
    "mutagen>=1.47.0",
    "reportlab>=4.0.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
